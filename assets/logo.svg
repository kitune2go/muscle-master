<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-labelledby="title desc">
  <title id="title">マッスルマスター</title>
  <desc id="desc">赤と金の文字にダンベルを組み合わせたロゴ</desc>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff5a4f"/><stop offset="1" stop-color="#ad1522"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe45d"/><stop offset="1" stop-color="#e79a16"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="7" dy="8" stdDeviation="1.5" flood-color="#050608" flood-opacity=".9"/></filter>
  </defs>
  <g filter="url(#shadow)" transform="rotate(-3 320 105)">
    <g transform="translate(20 65)" fill="#171a20" stroke="#f5c64f" stroke-width="5">
      <rect x="0" y="28" width="100" height="20" rx="9"/>
      <rect x="8" y="10" width="21" height="56" rx="7"/><rect x="33" y="17" width="17" height="42" rx="6"/>
      <rect x="71" y="17" width="17" height="42" rx="6"/><rect x="92" y="10" width="21" height="56" rx="7"/>
    </g>
    <text x="126" y="85" font-family="Noto Sans JP Thin,Noto Sans JP,Arial Black,sans-serif" font-size="72" font-weight="1000" font-style="italic" letter-spacing="-7" fill="url(#red)" stroke="#08090b" stroke-width="13" paint-order="stroke fill">マッスル</text>
    <text x="150" y="151" font-family="Noto Sans JP Thin,Noto Sans JP,Arial Black,sans-serif" font-size="75" font-weight="1000" font-style="italic" letter-spacing="-7" fill="url(#gold)" stroke="#08090b" stroke-width="13" paint-order="stroke fill">マスター</text>
    <text x="260" y="191" font-family="Arial Black,sans-serif" font-size="25" font-weight="900" font-style="italic" letter-spacing="4" fill="#fff" stroke="#08090b" stroke-width="7" paint-order="stroke fill">MUSCLE MASTER</text>
  </g>
</svg>
