<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" role="img" aria-labelledby="title desc">
<title id="title">Muscle Master trainer</title><desc id="desc">Adult anime-inspired fitness trainer with a high ponytail, red jacket and black sportswear, cheering with a fist.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2dc"/><stop offset=".55" stop-color="#f8d8c7"/><stop offset="1" stop-color="#e8b0b2"/></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#3a2028"/><stop offset=".55" stop-color="#702630"/><stop offset="1" stop-color="#b02a31"/></linearGradient>
 <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d83b42"/><stop offset="1" stop-color="#821823"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe4cf"/><stop offset="1" stop-color="#f4bea7"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#572027" flood-opacity=".25"/></filter>
</defs>
<rect width="420" height="560" rx="44" fill="url(#bg)"/>
<circle cx="333" cy="95" r="70" fill="#fff" opacity=".24"/><circle cx="66" cy="418" r="94" fill="#b5222a" opacity=".06"/>
<path d="M34 500c84-80 201-112 352-64v124H34z" fill="#841d25" opacity=".09"/>
