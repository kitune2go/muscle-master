<path d="M281 90c64-33 112 5 89 61-12 30-49 34-71 9 20 49 5 91-42 101 18-48 10-92-15-121z" fill="url(#hair)" filter="url(#shadow)"/>
<path d="M298 102c36-12 58 3 59 28-14-9-29-10-44-4z" fill="#d23b40"/>
