<path d="M181 230c-5 5-6 12-2 18M290 229c5 5 6 12 2 18" stroke="#ef9f91" stroke-width="8" stroke-linecap="round" opacity=".65"/>
<!-- neck --> <path d="M183 291c11 34 83 36 94 0l11 67-118-1z" fill="url(#skin)"/>
