<path d="M143 162c15-72 100-112 166-59 26 21 38 54 36 86-37-25-82-38-131-36-27 1-51 8-71 20z" fill="#49212a"/>
<path d="M150 157c13 55 3 109-26 139 3-60 5-109 26-139zM326 157c12 47 14 94 1 145-24-35-29-87-1-145z" fill="#5c222b"/>
